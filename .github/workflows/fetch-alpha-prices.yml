name: sdk - Alpha Prices

on:
  schedule:
    # Run every 30 minutes (alpha prices don't change that fast)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-alpha-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bittensor-v9-asi1-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests websockets "bittensor>=9.0.0,<10.0.0" "async-substrate-interface<2.0.0"

      - name: Debug imports
        run: |
          python << 'PYEOF'
          import sys
          print("Python:", sys.version)
          try:
              import bittensor as bt
              print("bittensor OK, version:", bt.__version__)
              from bittensor import AsyncSubtensor
              print("AsyncSubtensor from bittensor OK")
          except Exception as e:
              print("bittensor error (%s): %s" % (type(e).__name__, e))
          try:
              from bittensor.core.async_subtensor import AsyncSubtensor
              print("AsyncSubtensor from core OK")
          except Exception as e:
              print("bittensor.core error (%s): %s" % (type(e).__name__, e))
          try:
              import async_substrate_interface
              print("async_substrate_interface OK")
          except Exception as e:
              print("async_substrate_interface error (%s): %s" % (type(e).__name__, e))
          try:
              import scalecodec
              from scalecodec import GenericCall
              print("scalecodec + GenericCall OK")
          except Exception as e:
              print("scalecodec error (%s): %s" % (type(e).__name__, e))
          PYEOF

      - name: Fetch Alpha Prices
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_METRICS_NAMESPACE_ID: ${{ secrets.CF_METRICS_NAMESPACE_ID }}
          NETWORK: finney
        run: python .github/scripts/fetch_alpha_prices.py
