name: kv - Decentralization Score

on:
  # Run daily at 04:00 UTC (after other data fetches)
  schedule:
    - cron: '0 4 * * *'
  # Manual trigger
  workflow_dispatch:
  # Run after distribution workflow completes
  workflow_run:
    workflows: ["taostats - TAO Distribution"]
    types:
      - completed

permissions:
  contents: read

jobs:
  fetch-decentralization:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Calculate Decentralization Score
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_METRICS_NAMESPACE_ID }}
        run: |
          python .github/scripts/fetch_decentralization.py
