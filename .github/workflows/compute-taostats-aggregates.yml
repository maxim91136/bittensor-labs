name: kv - Taostats Aggregates

on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *' # every 5 minutes, +4 offset
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compute-aggregates:
    runs-on: ubuntu-latest
    name: Compute Taostats Aggregates and write to KV
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Compute aggregates and write to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_METRICS_NAMESPACE_ID: ${{ secrets.CF_METRICS_NAMESPACE_ID }}
        run: |
          python .github/scripts/compute_taostats_aggregates.py
