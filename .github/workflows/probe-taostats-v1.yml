name: TEMP probe taostats v1
on:
  push:
    branches: ['fix/taostats-v1-migration']
    paths: ['.github/workflows/probe-taostats-v1.yml', '.github/scripts/probe_taostats_v1.py']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
        run: python .github/scripts/probe_taostats_v1.py
