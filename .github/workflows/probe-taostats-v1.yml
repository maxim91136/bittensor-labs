name: TEMP dry-run taostats v1
on:
  push:
    branches: ['fix/taostats-v1-migration']
    paths: ['.github/workflows/probe-taostats-v1.yml']

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
      # bewusst KEINE Cloudflare-Zugangsdaten: der Lauf schreibt nichts in KV
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: top subnets (on-chain SDK + taostats)
        timeout-minutes: 20
        run: |
          pip install -q -r .github/requirements-bittensor.txt
          mkdir -p .github/data
          NETWORK=finney DAILY_EMISSION=3600 TOP_N=150 python .github/scripts/fetch_top_subnets.py > /tmp/subnets.log 2>&1 || echo "EXIT CODE $?"
          grep -vE "^\s*$" /tmp/subnets.log | tail -60 | cut -c1-300
          python - <<'PY'
          import json
          d = json.load(open('.github/data/top_subnets.json'))
          ts = d['top_subnets']
          print('subnets', len(ts), 'sources', sorted({str(e.get('ema_source')) for e in ts}))
          for e in ts[:3]:
              print({k: e.get(k) for k in ('netuid', 'taostats_name', 'taostats_tempo', 'taostats_emission_share', 'estimated_emission_daily', 'ema_source')})
          PY
# rerun
