name: Post-Deploy Smoke Test

on:
  # Manuell starten (der frühere Auslöser "Deploy Cloudflare Worker" existiert in diesem Repo nicht mehr)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Post Deploy Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run Python smoke test
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          export EXPECTED_VERSION="$(cat VERSION)"
          echo "Expected version: $EXPECTED_VERSION"
          python .github/scripts/post_deploy_smoke.py

      - name: Completed
        run: echo "Smoke tests complete; production site looks good." 
