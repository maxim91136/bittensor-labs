name: TEMP probe chain flow
on:
  push:
    branches: ['feat/tao-flow-snapshots']
    paths: ['.github/workflows/temp-probe-chain.yml']

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -q requests websockets "bittensor>=10.0.0,<11.0.0"
      - name: TAO flow (dry run, no Cloudflare credentials)
        run: python .github/scripts/fetch_tao_flow.py 2>&1 | grep -vE "punycode|trace-deprecation" | tail -40 | cut -c1-300
# rerun2
